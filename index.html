<!DOCTYPE html>
<html lang="ko" data-theme="linear"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI 변화 추적기 | Claude · ChatGPT · Gemini</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('aiBriefTheme2')||'linear'}catch(e){}</script>
<style>
/* ---------- theme tokens ---------- */
[data-theme=notion]{--bg:#ffffff;--bg2:#f7f7f5;--card:#ffffff;--text:#191919;--sub:#5f5e5b;--muted:#9b9a97;--line:#ebebea;--line2:#e3e2e0;--accent:#2383e2;--chip:#f1f1ef;--chipOn:#191919;--chipOnText:#fff;--shadow:none;--radius:6px;--hFont:800;--hSpace:-0.03em;--claude:#d9730d;--chatgpt:#0f7b6c;--gemini:#2383e2;--issue:#e03e3e;--tintC:#fbf3ec;--tintG:#edf3ec;--tintM:#e7f3f8;--tintI:#fdebec;--ok:#0f7b6c;--okbg:#ddedea;--part:#9f6b00;--partbg:#fbf3db;--self:#191919;--selfText:#fff;--bar:#ececea}
[data-theme=linear]{--bg:#08090a;--bg2:#0f1011;--card:#111214;--text:#f7f8f8;--sub:#b4b6bb;--muted:#8a8f98;--line:#1f2023;--line2:#2a2c30;--accent:#7c86ff;--chip:#17181b;--chipOn:#f7f8f8;--chipOnText:#08090a;--shadow:0 0 0 1px rgba(255,255,255,.03),0 8px 30px rgba(0,0,0,.35);--radius:12px;--hFont:600;--hSpace:-0.02em;--claude:#f0875a;--chatgpt:#27c498;--gemini:#6c9cff;--issue:#ff6369;--tintC:rgba(240,135,90,.12);--tintG:rgba(39,196,152,.12);--tintM:rgba(108,156,255,.12);--tintI:rgba(255,99,105,.12);--ok:#4cd6a4;--okbg:rgba(76,214,164,.12);--part:#f2c94c;--partbg:rgba(242,201,76,.12);--self:#f7f8f8;--selfText:#08090a;--bar:#1d1e21}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard Variable",Pretendard,"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;font-size:17px;line-height:1.75;word-break:keep-all;overflow-wrap:anywhere;transition:background .25s,color .25s}
a{color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:0 28px}
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(180%) blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:16px;height:60px}
.brand{font-weight:800;font-size:18px;letter-spacing:-0.02em;display:flex;align-items:center;gap:10px;white-space:nowrap}
.logo{width:26px;height:26px;border-radius:7px;background:conic-gradient(var(--claude) 0 33%,var(--chatgpt) 0 66%,var(--gemini) 0);flex:none}
.tabs{display:flex;gap:4px;margin-left:12px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;color:var(--muted);font:inherit;font-size:15.5px;font-weight:600;padding:6px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
.tabs button:hover,.tabs button.on{color:var(--text);background:var(--chip)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:middle;flex:none}
.badge{display:inline-block;min-width:19px;text-align:center;background:var(--issue);color:#fff;border-radius:999px;font-size:11.5px;font-weight:700;line-height:19px;padding:0 5px;margin-left:6px;vertical-align:1px}
.theme{margin-left:auto;display:flex;background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:3px;flex:none}
.theme button{border:0;background:none;color:var(--muted);font:inherit;font-size:13.5px;font-weight:700;padding:4px 12px;border-radius:999px;cursor:pointer}
.theme button{display:grid;place-items:center;width:38px;height:30px;padding:0!important;transition:background .2s,color .2s}
.theme button.notion.on{background:#ffb800;color:#fff}
.theme button.linear.on{background:#5e6ad2;color:#fff}
.theme button:not(.on):hover{color:var(--text)}
.hero{padding:64px 0 30px;border-bottom:1px solid var(--line)}
.hero .eyebrow{color:var(--muted);font-size:14px;font-weight:600;margin-bottom:6px;display:flex;align-items:center}
.hero h1{font-size:52px;line-height:1.15;margin:0;font-weight:var(--hFont);letter-spacing:var(--hSpace)}
.hero p{color:var(--sub);margin:12px 0 0;font-size:18px}
[data-theme=linear] .hero h1{background:linear-gradient(180deg,#fff 30%,#8a8f98);-webkit-background-clip:text;background-clip:text;color:transparent}
main{padding-bottom:80px}
.sec-title{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.06em;margin:46px 0 14px;display:flex;align-items:center;gap:10px}
.sec-title::after{content:'';flex:1;height:1px;background:var(--line)}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;box-shadow:var(--shadow)}
[data-theme=notion] .box{background:var(--bg2);border-color:transparent}
.srow{display:flex;gap:14px;align-items:baseline;padding:12px 0;border-top:1px solid var(--line)}
.srow:first-child{border-top:0;padding-top:0}
.srow:last-child{padding-bottom:0}
.mname{flex:none;width:86px;font-weight:700;font-size:15.5px;color:var(--c)}
.todo ol{margin:0;padding:0;list-style:none;counter-reset:t}
.todo li{counter-increment:t;position:relative;padding:8px 0 8px 40px}
.todo li::before{content:counter(t);position:absolute;left:0;top:9px;width:26px;height:26px;border-radius:50%;background:var(--text);color:var(--bg);font-size:13px;font-weight:800;display:grid;place-items:center}
.progress-mini{display:flex;align-items:center;gap:16px;cursor:pointer}
.bar{height:8px;background:var(--bar);border-radius:999px;overflow:hidden;flex:1}
.bar i{display:block;height:100%;border-radius:999px;background:var(--ok)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.tile:hover{transform:translateY(-2px);border-color:var(--line2)}
.tile .meta{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tile h4{margin:8px 0 0;font-size:17px;line-height:1.45;font-weight:700}
.tile.checked{opacity:.5}
.lab{display:inline-flex;align-items:center;font-size:12.5px;font-weight:700;border-radius:5px;padding:1px 8px;line-height:20px;white-space:nowrap}
.lab.m{color:var(--c);background:var(--t)}
.lab.issue{color:var(--issue);background:var(--tintI)}
.lab.feat{color:var(--sub);background:var(--chip)}
.lab.new{color:#111;background:#ffd84d}
.stars{color:#e2a700;font-size:12px;letter-spacing:1px}
.trend{border-left:3px solid var(--c);padding:4px 0 4px 20px;margin-top:34px}
.trend .k{font-size:13px;font-weight:700;color:var(--c);letter-spacing:.04em}
.trend .v{font-size:19px;line-height:1.7;margin-top:4px}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.stats span{font-size:13.5px;color:var(--sub);background:var(--chip);border-radius:999px;padding:3px 12px}
.chips{display:flex;gap:8px;margin:26px 0 0;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:999px;padding:6px 16px;font:inherit;font-size:14.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--chipOn);color:var(--chipOnText);border-color:var(--chipOn)}
.entry{display:grid;grid-template-columns:200px minmax(0,1fr);gap:40px;padding:48px 0;border-top:1px solid var(--line)}
.side .in{position:sticky;top:84px}
.side .d{font-size:15px;font-weight:600;color:var(--sub);display:flex;align-items:center;gap:9px}
[data-theme=linear] .side .d::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 22%,transparent);flex:none}
.side .labs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.ck-wrap{margin-top:16px}
.body h2{font-size:32px;line-height:1.3;margin:0 0 18px;font-weight:var(--hFont);letter-spacing:var(--hSpace)}
.entry.checked .body h2{color:var(--muted)}
.entry.checked .body h2::before{content:'✓ ';color:var(--ok)}
.hero-img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:var(--radius);display:block;margin:0 0 6px;border:1px solid var(--line)}
.lead{font-size:18px;margin:0}
.avail{margin-top:14px;font-size:14.5px;color:var(--sub);display:flex;gap:8px;align-items:baseline}
.avail b{color:var(--text);font-weight:700;white-space:nowrap}
.part{margin-top:30px}
.ph{font-size:15.5px;font-weight:800;letter-spacing:-0.01em;color:var(--text);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.ph .n{width:22px;height:22px;border-radius:5px;background:var(--c);color:#fff;font-size:11.5px;display:grid;place-items:center;letter-spacing:0}
.entry.issue .ph .n{background:var(--issue)}
.steps{list-style:none;margin:0;padding:0}
.steps li{position:relative;padding:5px 0 5px 28px}
.steps li::before{content:'→';position:absolute;left:0;top:5px;color:var(--muted);font-weight:700}
[data-theme=linear] .steps li::before{content:'';top:16px;left:6px;width:6px;height:6px;border-radius:50%;background:var(--c)}
.cmp{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--card)}
.crow{display:grid;grid-template-columns:120px 132px minmax(0,1fr);gap:14px;padding:13px 16px;border-top:1px solid var(--line);align-items:baseline}
.crow:first-child{border-top:0}
.crow.me{background:var(--bg2)}
.crow .who{font-weight:700;font-size:15.5px;display:flex;align-items:center}
.st{display:inline-block;font-size:12.5px;font-weight:700;border-radius:5px;padding:1px 8px;white-space:nowrap}
.st.self{background:var(--self);color:var(--selfText)}.st.yes{background:var(--okbg);color:var(--ok)}.st.partial{background:var(--partbg);color:var(--part)}.st.no{background:var(--chip);color:var(--muted)}
.verdict{margin-top:14px;padding:14px 18px;border-radius:var(--radius);background:var(--bg2);border-left:3px solid var(--accent);font-size:16.5px}
.verdict b{margin-right:8px}
.vlist a{display:flex;align-items:center;gap:14px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--radius);text-decoration:none;margin-bottom:8px;background:var(--card);transition:border-color .15s}
.vlist a:hover{border-color:var(--line2)}
.play{flex:none;width:34px;height:34px;border-radius:50%;background:#ff0033;display:grid;place-items:center}
.play::after{content:'';border-left:10px solid #fff;border-top:6px solid transparent;border-bottom:6px solid transparent;margin-left:3px}
.vt{flex:1;min-width:0;font-weight:600;font-size:15.5px;line-height:1.5}
.vt small{display:block;color:var(--muted);font-weight:500;font-size:13.5px;margin-top:2px}
.lg{flex:none;font-size:11.5px;font-weight:800;border-radius:4px;padding:0 6px;line-height:19px;background:var(--tintI);color:var(--issue)}
.lg.en{background:var(--tintM);color:var(--gemini)}
.src{margin-top:30px;font-size:13.5px;color:var(--muted)}
.src a{color:var(--muted)}
.ck{border:1px solid var(--line2);background:var(--card);color:var(--sub);font:inherit;font-size:14px;font-weight:700;padding:6px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
.ck::before{content:'';width:13px;height:13px;border-radius:4px;border:1.5px solid currentColor}
.ck:hover{color:var(--ok);border-color:var(--ok)}
.ck.done{background:var(--ok);border-color:var(--ok);color:#fff}
.ck.done::before{content:'✓';border:0;font-size:13px;line-height:13px;text-align:center}
.ck.sm{font-size:12.5px;padding:3px 10px}
.empty{color:var(--muted);text-align:center;padding:60px 0}
.pbig{display:flex;gap:34px;align-items:center;flex-wrap:wrap}
.ring{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;flex:none}
.ring div{width:118px;height:118px;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center;font-size:32px;font-weight:800;line-height:1.1}
[data-theme=notion] .box .ring div{background:var(--bg2)}
.ring small{display:block;font-size:13px;color:var(--muted);font-weight:500}
.prow{display:grid;grid-template-columns:96px 1fr 104px;gap:14px;align-items:center;padding:8px 0}
.prow .ct{text-align:right;color:var(--muted);font-size:14px}
.days{display:flex;gap:6px;align-items:flex-end;height:110px}
.days div{flex:1;text-align:center;font-size:11.5px;color:var(--muted)}
.days i{display:block;background:var(--ok);border-radius:3px 3px 0 0;margin:0 auto 4px;width:70%;min-height:2px}
.trow{display:flex;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.trow:first-child{border-top:0;padding-top:0}
.trow .tt{flex:1;min-width:0;cursor:pointer;font-weight:500;line-height:1.5}
.trow .tt:hover{text-decoration:underline}
.btns{margin-top:18px;display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line2);background:var(--card);color:var(--sub);border-radius:8px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer}
.bnav{display:none}
footer{color:var(--muted);font-size:13px;text-align:center;padding:30px 20px 40px;border-top:1px solid var(--line)}
@media (max-width:860px){
  .entry{grid-template-columns:minmax(0,1fr);gap:14px;padding:36px 0}
  .side .in{position:static;display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
  .side .labs{margin-top:0}
  .ck-wrap{margin:0 0 0 auto}
  .grid3{grid-template-columns:1fr 1fr}
}
@media (max-width:640px){
  body{font-size:16px}
  .wrap{padding:0 18px}
  .topbar .wrap{height:54px}
  .tabs{display:none}
  .brand{font-size:16.5px}
  .theme button{padding:3px 10px;font-size:12.5px}
  .hero{padding:34px 0 22px}
  .hero h1{font-size:34px}
  .hero p{font-size:16px}
  .body h2{font-size:24px;margin-bottom:14px}
  .lead{font-size:16.5px}
  .trend{margin-top:22px}
  .trend .v{font-size:16.5px}
  .grid3{grid-template-columns:1fr}
  .crow{grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:12px 14px}
  .crow .note{grid-column:1 / -1;font-size:15px;color:var(--sub)}
  .srow{flex-direction:column;gap:2px}
  .prow{grid-template-columns:70px 1fr 78px;gap:10px}
  .pbig{gap:20px}
  .ring{width:120px;height:120px}.ring div{width:94px;height:94px;font-size:26px}
  .box{padding:18px}
  .side .d{width:100%}
  .ck-wrap{margin:6px 0 0;width:100%}
  .ck-wrap .ck{width:100%;justify-content:center;padding:9px}
  .trow{flex-wrap:wrap}
  .trow .tt{flex-basis:100%;order:3}
  .trow .ck{margin-left:auto}
  main,footer{padding-bottom:110px}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bnav button{border:0;background:none;color:var(--muted);font:inherit;font-size:11.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;cursor:pointer;position:relative}
  .bnav button.on{color:var(--text)}
  .bnav .ic{width:22px;height:22px;display:grid;place-items:center}
  .bnav .ic i{width:12px;height:12px;border-radius:50%;background:var(--c)}
  .bnav button.on .ic i{box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 25%,transparent)}
  .bnav .badge{position:absolute;top:0;left:calc(50% + 6px);margin:0;font-size:10.5px;line-height:16px;min-width:16px}
}
</style></head><body>

  <div class="brand"><span class="logo"></span>AI 변화 추적기</div>

</div></div>
<main><div class="wrap" id="app"></div></main>

/* ---- cross-device sync via GitHub (branch "sync", file checks.json) ---- */
const SYNC={cfg:null,state:'off',last:null,msg:'',timer:null,busy:false,
  load(){try{this.cfg=JSON.parse(localStorage.getItem('aiBriefSync')||'null')}catch(e){this.cfg=null}this.state=this.cfg?'idle':'off'},
  save(c){this.cfg=c;try{c?localStorage.setItem('aiBriefSync',JSON.stringify(c)):localStorage.removeItem('aiBriefSync')}catch(e){}this.state=c?'idle':'off'},
  api(path,opt={}){const c=this.cfg;return fetch('https://api.github.com/repos/'+c.o+'/'+c.r+path,{cache:'no-store',...opt,headers:{'Authorization':'Bearer '+c.t,'Accept':'application/vnd.github+json',...(opt.headers||{})}})},
  b64e(s){return btoa(unescape(encodeURIComponent(s)))},b64d(s){return decodeURIComponent(escape(atob(s.replace(/\n/g,''))))},
  async ensureBranch(){let r=await this.api('/git/ref/heads/sync');if(r.ok)return;const repo=await (await this.api('')).json();const base=await (await this.api('/git/ref/heads/'+repo.default_branch)).json();r=await this.api('/git/refs',{method:'POST',body:JSON.stringify({ref:'refs/heads/sync',sha:base.object.sha})});if(!r.ok&&r.status!==422)throw new Error('branch '+r.status)},
  async pull(){const r=await this.api('/contents/checks.json?ref=sync&t='+Date.now());if(r.status===404)return{sha:null,data:{items:{}}};if(!r.ok)throw new Error('pull '+r.status);const j=await r.json();return{sha:j.sha,data:JSON.parse(this.b64d(j.content))}},
  merge(remote){let changed=false;const R=remote.items||{};for(const id in R){const rv=R[id],lu=META[id];if(!lu||rv.u>lu){META[id]=rv.u;if(rv.c){if(CK[id]!==rv.c){CK[id]=rv.c;changed=true}}else if(CK[id]){delete CK[id];changed=true}}}
    const out={};const ids=new Set([...Object.keys(META),...Object.keys(CK),...Object.keys(R)]);for(const id of ids){out[id]={c:CK[id]||null,u:META[id]||(CK[id]||new Date(0).toISOString())}}return{changed,out}},
  async run(push){if(!this.cfg||this.busy)return;this.busy=true;this.state='busy';drawSync();
    try{for(let i=0;i<3;i++){const {sha,data}=await this.pull();const {changed,out}=this.merge(data);saveCK();if(changed)render(true);
        const same=JSON.stringify(out)===JSON.stringify(data.items||{});if(same&&!push)break;if(same)break;
        if(!sha)await this.ensureBranch();
        const r=await this.api('/contents/checks.json',{method:'PUT',body:JSON.stringify({message:'sync checks',branch:'sync',content:this.b64e(JSON.stringify({v:1,items:out},null,1)),...(sha?{sha}:{})})});
        if(r.ok)break;if(r.status===409||r.status===422)continue;throw new Error('push '+r.status)}
      this.state='ok';this.last=new Date();this.msg=''}
    catch(e){this.state='err';this.msg=String(e.message||e)}
    this.busy=false;drawSync()},
  schedule(){if(!this.cfg)return;clearTimeout(this.timer);this.timer=setTimeout(()=>this.run(true),1200)}};
SYNC.load();
function drawSync(){const el=document.getElementById('syncbox');if(!el)return;el.innerHTML=syncHTML();}
function syncHTML(){const s=SYNC;const st={off:['꺼짐','var(--muted)'],idle:['연결됨','var(--sub)'],busy:['동기화 중…','var(--accent)'],ok:['동기화 완료','var(--ok)'],err:['오류','var(--issue)']}[s.state];
  return `<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><b>기기 간 동기화</b><span class="lab" style="color:${st[1]};background:var(--chip)">${st[0]}</span>${s.last?`<span style="color:var(--muted);font-size:13.5px">마지막 ${s.last.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}</span>`:''}</div>
  <p style="color:var(--sub);font-size:14.5px;margin:8px 0 12px">${s.cfg?'PC와 휴대폰의 확인 기록이 자동으로 맞춰져요. 체크하면 1초 뒤 저장되고, 화면을 보고 있는 동안 30초마다 다른 기기 기록을 자동으로 불러와요. 버튼을 누를 필요 없어요.':'동기화 코드를 한 번 붙여넣으면 이 기기의 확인 기록이 다른 기기와 자동으로 맞춰져요.'}${s.msg?`<br><span style="color:var(--issue)">${s.msg}</span>`:''}</p>
  ${s.cfg?`<div class="btns" style="margin:0"><button class="btn" onclick="SYNC.run(true)">지금 동기화</button><button class="btn" onclick="showQR()">다른 기기 연결 (QR)</button><button class="btn" onclick="if(confirm('이 기기의 동기화를 끌까요? (기록은 남아요)')){SYNC.save(null);drawSync()}">이 기기 연결 해제</button></div>`
  :`<div style="display:flex;gap:8px;flex-wrap:wrap"><input id="synccode" placeholder="동기화 코드 붙여넣기" style="flex:1;min-width:200px;font:inherit;font-size:15px;padding:8px 12px;border-radius:8px;border:1px solid var(--line2);background:var(--card);color:var(--text)"><button class="btn" onclick="connectSync()">연결</button></div>`}`}
function syncCode(){return 'AIB-'+btoa(unescape(encodeURIComponent(JSON.stringify(SYNC.cfg))))}
function loadQRLib(){return new Promise((ok,no)=>{if(window.qrcode)return ok();const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
async function showQR(){if(!SYNC.cfg)return;const url=location.origin+location.pathname+'#sync='+syncCode();

  const q=qrcode(0,'M');q.addData(url);q.make();
  const d=document.createElement('div');d.id='qrdlg';d.style.cssText='position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:20px';

  d.onclick=e=>{if(e.target===d)d.remove()};document.body.appendChild(d)}
function linkFromHash(){const m=location.hash.match(/^#sync=(AIB-[A-Za-z0-9+/=%]+)/);if(!m)return;try{const c=JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(m[1]).replace(/^AIB-/,'')))));if(c.o&&c.r&&c.t){SYNC.save(c);history.replaceState(null,'',location.pathname+'#progress');setTimeout(()=>alert('이 기기가 동기화에 연결됐어요. 이제 확인 기록이 다른 기기와 자동으로 맞춰져요.'),300)}}catch(e){history.replaceState(null,'',location.pathname)}}
linkFromHash();

setInterval(()=>{if(document.visibilityState==='visible'&&SYNC.cfg)SYNC.run(false)},30000);
const isCk=id=>!!CK[id];
const latest=DATA.briefs.slice().sort((a,b)=>b.date.localeCompare(a.date))[0];
const items=DATA.items.slice().sort((a,b)=>b.date.localeCompare(a.date)||(b.importance||0)-(a.importance||0));
let filter='all';
document.getElementById('upd').textContent=DATA.updated;
const fmt=d=>{const x=new Date(d+'T00:00:00');return `${x.getFullYear()}년 ${x.getMonth()+1}월 ${x.getDate()}일 (${'일월화수목금토'[x.getDay()]})`};
const fmtS=d=>{const x=new Date(d+'T00:00:00');return `${x.getMonth()+1}월 ${x.getDate()}일`};
const md=iso=>{const x=new Date(iso);return `${x.getMonth()+1}/${x.getDate()}`};
const isNew=it=>(new Date(latest.date)-new Date(it.date))/864e5<=2;
const mvar=m=>`--c:${M[m].c};--t:${M[m].t}`;
const mlab=m=>`<span class="lab m" style="${mvar(m)}">${M[m].name}</span>`;
const stars=n=>`<span class="stars" title="중요도">${'★'.repeat(n||1)}${'☆'.repeat(3-(n||1))}</span>`;
function ckBtn(id,sm){const d=CK[id];return `<button class="ck ${d?'done':''} ${sm?'sm':''}" onclick="toggle('${id}',event)">${d?'확인함 '+md(d):'확인했어요'}</button>`}
function toggle(id,ev){if(ev)ev.stopPropagation();setCk(id,!CK[id]);afterChange();const y=scrollY;render(true);scrollTo(0,y)}
function setTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem('aiBriefTheme2',t)}catch(e){};drawTheme()}
function drawTheme(){const t=document.documentElement.dataset.theme;document.getElementById('theme').innerHTML=[['notion','<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>','햇님 (밝은 Notion 테마)'],['linear','<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 14.6A8.5 8.5 0 0 1 9.4 3.5a8.5 8.5 0 1 0 11.1 11.1z"/></svg>','달님 (어두운 Linear 테마)']].map(([k,ic,lb])=>`<button class="${t===k?'on':''} ${k}" onclick="setTheme('${k}')" title="${lb}" aria-label="${lb}">${ic}</button>`).join('')}

function entry(it){
  const iss=it.type==='issue';
  let n=0; const part=(title,html)=>`<div class="part"><div class="ph"><span class="n">${++n}</span>${title}</div>${html}</div>`;
  let b=`<h2>${it.title}</h2>`;
  if(it.image) b+=`<img class="hero-img" src="${it.image}" alt="">`;
  b+=part(iss?'무슨 일인가요':'무엇이 바뀌었나요',`<p class="lead">${it.what}</p>${it.availability?`<div class="avail"><b>이용 대상</b><span>${it.availability}</span></div>`:''}`);
  if(it.howto&&it.howto.length) b+=part(iss?'내가 할 일':'이렇게 활용해 보세요',`<ul class="steps">${it.howto.map(x=>`<li>${x}</li>`).join('')}</ul>`);
  if(it.compare&&it.compare.length) b+=part('다른 AI와 비교',`<div class="cmp">${it.compare.map(r=>`<div class="crow ${r.status==='self'?'me':''}"><span class="who"><span class="dot" style="background:${M[r.model].c}"></span>${M[r.model].name}</span><span class="stc"><span class="st ${r.status}">${ST[r.status]}</span></span><span class="note">${r.note}</span></div>`).join('')}</div>${it.verdict?`<div class="verdict"><b>한줄 정리</b>${it.verdict}</div>`:''}`);
  else if(it.verdict) b+=`<div class="verdict">${it.verdict}</div>`;
  if(it.videos&&it.videos.length) b+=part('관련 영상',`<div class="vlist">${it.videos.map(v=>`<a href="${v.url}" target="_blank" rel="noopener"><span class="play"></span><span class="vt">${v.title}<small>${v.channel}${v.len?' · '+v.len:''}</small></span><span class="lg ${v.lang==='ko'?'':'en'}">${v.lang==='ko'?'한국어':'영어'}</span></a>`).join('')}</div>`);
  if(it.sources&&it.sources.length) b+=`<div class="src">출처 · ${it.sources.map(s=>`<a href="${s.url}" target="_blank" rel="noopener">${s.title}</a>`).join(' · ')}</div>`;
  return `<article class="entry ${iss?'issue':''} ${isCk(it.id)?'checked':''}" id="${it.id}" style="${mvar(it.model)}">
   <aside class="side"><div class="in"><div class="d">${fmt(it.date)}</div><div class="labs">${mlab(it.model)}<span class="lab ${iss?'issue':'feat'}">${iss?'이슈':'새 기능'}</span>${isNew(it)&&!isCk(it.id)?'<span class="lab new">NEW</span>':''}${stars(it.importance)}</div><div class="ck-wrap">${ckBtn(it.id)}</div></div></aside>
   <div class="body">${b}</div></article>`;
}
function tile(it){return `<div class="tile ${isCk(it.id)?'checked':''}" style="${mvar(it.model)}" onclick="go('${it.model}','${it.id}')"><div class="meta">${mlab(it.model)}${it.type==='issue'?'<span class="lab issue">이슈</span>':''}<span>${fmtS(it.date)}</span></div><h4>${it.title}</h4></div>`}

function home(){
  const s=latest.summary, tot=items.length, done=items.filter(x=>isCk(x.id)).length;
  let h=`<section class="hero"><div class="eyebrow">${fmt(latest.date)} · ${latest.period}</div><h1>오늘의 AI 브리핑</h1><p>Claude, ChatGPT, Gemini에서 무엇이 바뀌었는지 한 번에.</p></section>`;
  h+=`<div class="sec-title">3줄 요약</div><div class="box">${MODELS.map(m=>`<div class="srow"><span class="mname" style="${mvar(m)}">${M[m].name}</span><span>${s[m]||'새 소식 없음'}</span></div>`).join('')}</div>`;
  if(latest.todo&&latest.todo.length) h+=`<div class="sec-title">오늘 5분 투자로 써볼 것</div><div class="box todo"><ol>${latest.todo.map(x=>`<li>${x}</li>`).join('')}</ol></div>`;
  h+=`<div class="sec-title">내 확인 현황</div><div class="box progress-mini" onclick="go('progress')"><b style="white-space:nowrap">${done} / ${tot}건</b><div class="bar"><i style="width:${tot?done/tot*100:0}%"></i></div><span style="color:var(--muted);font-size:14px;white-space:nowrap">${tot?Math.round(done/tot*100):0}% →</span></div>`;
  const rec=items.filter(it=>isNew(it)||it.importance>=3);
  h+=`<div class="sec-title">주목할 소식</div><div class="grid3">${rec.map(tile).join('')}</div>`;
  const iss=items.filter(it=>it.type==='issue');
  if(iss.length) h+=`<div class="sec-title">놓치면 안 되는 이슈</div>${iss.map(entry).join('')}`;
  return h;
}
function model(m){
  const all=items.filter(it=>it.model===m), dn=all.filter(x=>isCk(x.id)).length;
  const list=all.filter(it=>filter==='all'||(filter==='unread'?!isCk(it.id):it.type===filter));
  let h=`<section class="hero" style="${mvar(m)}"><div class="eyebrow"><span class="dot" style="background:${M[m].c}"></span>${M[m].name} 변경 기록</div><h1>${M[m].name}</h1>
  <div class="trend"><div class="k">최근 흐름 한눈에</div><div class="v">${(DATA.trends||{})[m]||''}</div></div>
  <div class="stats"><span>누적 ${all.length}건</span><span>확인 ${dn} / ${all.length}</span><span>새 기능 ${all.filter(x=>x.type==='feature').length}</span><span>이슈 ${all.filter(x=>x.type==='issue').length}</span></div>
  <div class="chips">${[['all','전체'],['unread',`안 본 것 ${all.length-dn}`],['feature','새 기능'],['issue','이슈']].map(([k,n])=>`<button class="chip ${filter===k?'on':''}" onclick="filter='${k}';render(true)">${n}</button>`).join('')}</div></section>`;
  return h+(list.length?list.map(entry).join(''):'<div class="empty">해당하는 항목이 없어요.</div>');
}
function progress(){
  const tot=items.length, done=items.filter(x=>isCk(x.id)).length, pct=tot?Math.round(done/tot*100):0;
  const imp=items.filter(x=>!isCk(x.id)&&(x.importance||1)>=3).length;
  let h=`<section class="hero"><div class="eyebrow">AI 변동사항 학습 기록</div><h1>내 확인 현황</h1></section>`;
  h+=`<div class="sec-title">전체</div><div class="box pbig"><div class="ring" style="background:conic-gradient(var(--ok) ${pct*3.6}deg,var(--bar) 0)"><div>${pct}%<small>${done} / ${tot}건</small></div></div><div style="flex:1;min-width:200px"><div style="font-size:21px;font-weight:800">${pct===100?'전부 확인했어요':pct>=70?'거의 다 따라잡았어요':pct>=30?'절반 가까이 왔어요':'아직 볼 게 많아요'}</div><div style="color:var(--sub)">안 본 항목 <b style="color:var(--issue)">${tot-done}</b>건 · 중요(★★★) <b style="color:var(--issue)">${imp}</b>건 · 이슈 미확인 <b>${items.filter(x=>x.type==='issue'&&!isCk(x.id)).length}</b>건</div></div></div>`;
  const row=(name,c,a)=>{const d=a.filter(x=>isCk(x.id)).length,p=a.length?d/a.length*100:0;return `<div class="prow"><b style="color:${c}">${name}</b><div class="bar"><i style="width:${p}%;background:${c}"></i></div><span class="ct">${d} / ${a.length} (${Math.round(p)}%)</span></div>`};
  h+=`<div class="sec-title">모델별 · 종류별 확인률</div><div class="box">${MODELS.map(m=>row(M[m].name,M[m].c,items.filter(x=>x.model===m))).join('')}${row('새 기능','var(--sub)',items.filter(x=>x.type==='feature'))}${row('이슈','var(--issue)',items.filter(x=>x.type==='issue'))}</div>`;
  const days=[];for(let i=13;i>=0;i--){const x=new Date();x.setDate(x.getDate()-i);const k=x.toDateString();days.push([x,Object.values(CK).filter(v=>new Date(v).toDateString()===k).length])}
  const mx=Math.max(1,...days.map(d=>d[1])), narrow=innerWidth<640;
  h+=`<div class="sec-title">최근 2주 확인 기록</div><div class="box"><div class="days">${days.map(([x,n],i)=>`<div><b style="color:var(--text)">${n||''}</b><i style="height:${n/mx*70}px"></i>${narrow?x.getDate():`${x.getMonth()+1}/${x.getDate()}`}</div>`).join('')}</div></div>`;
  const un=items.filter(x=>!isCk(x.id)).sort((a,b)=>(b.importance||1)-(a.importance||1)||b.date.localeCompare(a.date));
  h+=`<div class="sec-title">아직 안 본 항목 ${un.length}</div><div class="box">${un.length?un.map(it=>`<div class="trow" style="${mvar(it.model)}">${mlab(it.model)}${stars(it.importance)}<span class="tt" onclick="go('${it.model}','${it.id}')">${it.title}</span>${ckBtn(it.id,1)}</div>`).join(''):'<div class="empty" style="padding:20px">모두 확인했어요!</div>'}</div>`;
  const rc=items.filter(x=>isCk(x.id)).sort((a,b)=>CK[b.id].localeCompare(CK[a.id])).slice(0,10);
  if(rc.length) h+=`<div class="sec-title">최근 확인한 항목</div><div class="box">${rc.map(it=>`<div class="trow" style="${mvar(it.model)}">${mlab(it.model)}<span class="tt" onclick="go('${it.model}','${it.id}')">${it.title}</span>${ckBtn(it.id,1)}</div>`).join('')}</div>`;
  h+=`<div class="btns"><button class="btn" onclick="if(confirm('모든 항목을 확인 처리할까요?')){items.forEach(x=>{if(!CK[x.id])setCk(x.id,true)});afterChange();render(true)}">전부 확인 처리</button><button class="btn" onclick="if(confirm('확인 기록을 모두 지울까요?')){Object.keys(CK).forEach(id=>setCk(id,false));afterChange();render(true)}">확인 기록 초기화</button></div>`;
  h+=`<div class="sec-title">기기 간 동기화</div><div class="box" id="syncbox">${syncHTML()}</div>`;
  return h;
}
const cur=()=>{const t=location.hash.slice(1).split('/')[0]||'home';return M[t]?t:'home'};
function go(m,id){filter='all';location.hash=m+(id?'/'+id:'')}
const unc=m=>items.filter(x=>(m==='all'||x.model===m)&&!isCk(x.id)).length;
const ICON={home:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',progress:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg>'};
function render(keep){
  const t=cur();
  const badge=k=>{const n=MODELS.includes(k)?unc(k):k==='progress'?unc('all'):0;return n?`<span class="badge">${n}</span>`:''};
  document.getElementById('tabs').innerHTML=Object.keys(M).map(k=>`<button class="${k===t?'on':''}" onclick="go('${k}')">${M[k].c?`<span class="dot" style="background:${M[k].c}"></span>`:''}${M[k].name}${badge(k)}</button>`).join('');
  document.getElementById('bnav').innerHTML=Object.keys(M).map(k=>`<button class="${k===t?'on':''}" onclick="go('${k}')" style="${M[k].c?'--c:'+M[k].c:''}"><span class="ic">${ICON[k]||'<i></i>'}</span>${M[k].short}${badge(k)}</button>`).join('');
  document.getElementById('app').innerHTML=t==='home'?home():t==='progress'?progress():model(t);
  drawTheme();
  if(keep) return;
  const id=location.hash.split('/')[1];
  if(id){const el=document.getElementById(id);if(el)setTimeout(()=>el.scrollIntoView({behavior:'smooth'}),30)}else scrollTo(0,0);
}
addEventListener('hashchange',()=>render());render();SYNC.run(false);
</script>
</body></html>
